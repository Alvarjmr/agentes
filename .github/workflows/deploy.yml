name: CI/CD Pipeline - Citas Escolares Serverless

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Obligatorio para autenticación OIDC con AWS (Sin llaves permanentes)
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  # ==============================================================
  # ETAPA 1: DESPLIEGUE DE INFRAESTRUCTURA (TERRAFORM)
  # ==============================================================
  deploy-infrastructure:
    name: "1. Despliegue de Infraestructura"
    runs-on: ubuntu-latest
    outputs:
      api_endpoint: ${{ steps.tf_outputs.outputs.api_endpoint }}
      s3_bucket: ${{ steps.tf_outputs.outputs.s3_bucket }}
      cloudfront_id: ${{ steps.tf_outputs.outputs.cloudfront_id }}
      cloudfront_url: ${{ steps.tf_outputs.outputs.cloudfront_url }}
      cognito_user_pool_id: ${{ steps.tf_outputs.outputs.cognito_user_pool_id }}
      cognito_app_client_id: ${{ steps.tf_outputs.outputs.cognito_app_client_id }}
      lambda_function_name: ${{ steps.tf_outputs.outputs.lambda_function_name }}

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Validar Secreto OIDC de AWS
        run: |
          if [ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            echo "::error title=Falta Secreto AWS_ROLE_TO_ASSUME::El secreto 'AWS_ROLE_TO_ASSUME' no está configurado en GitHub Secrets."
            echo "=========================================================================="
            echo "❌ ERROR: No se puede autenticar con AWS sin el rol de IAM OIDC."
            echo ""
            echo "Para resolver este fallo:"
            echo "1. Ejecuta el bootstrap para crear los recursos de OIDC en AWS:"
            echo "   powershell -File ./bootstrap.ps1"
            echo "   (o manualmente en ./bootstrap con terraform init && terraform apply)"
            echo "2. Ve a la configuración de tu repositorio en GitHub:"
            echo "   https://github.com/Alvarjmr/agentes/settings/secrets/actions"
            echo "3. Crea un New repository secret con:"
            echo "   Nombre: AWS_ROLE_TO_ASSUME"
            echo "   Valor:  arn:aws:iam::<ID_DE_CUENTA>:role/citas-escolares-github-oidc-role"
            echo "=========================================================================="
            exit 1
          fi

      - name: Autenticación en AWS mediante OIDC (Zero-Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Verificar Backend de Estado Remoto
        working-directory: ./terraform
        run: |
          if [ ! -f "backend.tf" ]; then
            echo "::warning title=Estado Local::No se detectó 'backend.tf'. Terraform ejecutará con backend local. Ejecuta bootstrap.ps1 para enlazar S3 remoto."
          fi

      - name: Inicializar Terraform
        working-directory: ./terraform
        run: terraform init

      - name: Validar Sintaxis de Terraform
        working-directory: ./terraform
        run: terraform validate

      - name: Aplicar Infraestructura (Terraform Apply)
        working-directory: ./terraform
        run: terraform apply -auto-approve

      - name: Exportar Variables de Salida de Infraestructura
        id: tf_outputs
        working-directory: ./terraform
        run: |
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "cloudfront_url=$(terraform output -raw cloudfront_url)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_app_client_id=$(terraform output -raw cognito_app_client_id)" >> $GITHUB_OUTPUT
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT

  # ==============================================================
  # ETAPA 2: PRUEBAS Y DESPLIEGUE DEL BACKEND (AWS LAMBDA)
  # ==============================================================
  deploy-backend:
    name: "2. Despliegue del Backend"
    runs-on: ubuntu-latest
    needs: deploy-infrastructure

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar Pruebas Unitarias del Backend
        working-directory: ./backend
        run: |
          node test/local-test.js

      - name: Autenticación en AWS mediante OIDC (Zero-Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Empaquetar Código Fuente del Microservicio
        working-directory: ./backend/src
        run: |
          zip -r ../lambda_artifact.zip .

      - name: Actualizar Código en AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ needs.deploy-infrastructure.outputs.lambda_function_name }} \
            --zip-file fileb://backend/lambda_artifact.zip

      - name: Esperar a que Lambda termine la actualización
        run: |
          aws lambda wait function-updated \
            --function-name ${{ needs.deploy-infrastructure.outputs.lambda_function_name }}

  # ==============================================================
  # ETAPA 3: CONFIGURACIÓN Y DESPLIEGUE DEL FRONTEND (S3 + CLOUDFRONT)
  # ==============================================================
  deploy-frontend:
    name: "3. Despliegue del Frontend"
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-backend]

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Inyectar Variables de Conexión en frontend/config.js
        run: |
          cat << 'EOF' > frontend/config.js
          const CONFIG = {
            API_BASE_URL: "${{ needs.deploy-infrastructure.outputs.api_endpoint }}",
            COGNITO: {
              REGION: "${{ env.AWS_REGION }}",
              USER_POOL_ID: "${{ needs.deploy-infrastructure.outputs.cognito_user_pool_id }}",
              APP_CLIENT_ID: "${{ needs.deploy-infrastructure.outputs.cognito_app_client_id }}"
            },
            DOCENTES: [
              { id: "101", nombre: "Profa. Claudia Patricia", materia: "Matemáticas", grado: "Grado 9°", avatar: "CP" },
              { id: "102", nombre: "Prof. Ramón García", materia: "Ciencias Naturales", grado: "Grado 9°", avatar: "RG" },
              { id: "103", nombre: "Profa. Laura Jiménez", materia: "Español y Literatura", grado: "Grado 9°", avatar: "LJ" }
            ],
            FRANJAS_HORARIAS: [
              "08:00 AM", "08:30 AM", "09:00 AM",
              "10:00 AM", "10:30 AM", "11:00 AM",
              "02:00 PM", "02:30 PM", "03:00 PM"
            ]
          };
          EOF
          echo "config.js actualizado con endpoint: ${{ needs.deploy-infrastructure.outputs.api_endpoint }}"

      - name: Autenticación en AWS mediante OIDC (Zero-Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Sincronizar Archivos Estáticos a Amazon S3
        run: |
          aws s3 sync ./frontend s3://${{ needs.deploy-infrastructure.outputs.s3_bucket }} \
            --delete \
            --exclude ".git*" \
            --cache-control "public, max-age=31536000, immutable"

          # index.html no se debe cachear agresivamente para reflejar cambios rápidos
          aws s3 cp ./frontend/index.html s3://${{ needs.deploy-infrastructure.outputs.s3_bucket }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidar Caché de Amazon CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-infrastructure.outputs.cloudfront_id }} \
            --paths "/*"

      - name: Resumen de Despliegue Exitoso
        run: |
          echo "=========================================================="
          echo "🚀 DESPLIEGUE COMPLETADO EXITOSAMENTE"
          echo "🌐 URL Aplicación PWA: ${{ needs.deploy-infrastructure.outputs.cloudfront_url }}"
          echo "📡 API Endpoint:       ${{ needs.deploy-infrastructure.outputs.api_endpoint }}"
          echo "=========================================================="

  # ==============================================================
  # ETAPA 4: PRUEBAS DE DISPONIBILIDAD (SMOKE TESTS - SITIO ARRIBA)
  # ==============================================================
  smoke-tests:
    name: "4. Comprobar Disponibilidad del Sitio"
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-backend, deploy-frontend]

    steps:
      - name: Esperar inicio de propagación (10s)
        run: sleep 10

      - name: Comprobar que el Frontend PWA responda HTTP 200 (CloudFront CDN)
        run: |
          URL="${{ needs.deploy-infrastructure.outputs.cloudfront_url }}"
          echo "Comprobando disponibilidad de Frontend en: $URL"

          SUCCESS=false
          for i in {1..6}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "Intento $i: Código HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" -eq 200 ]; then
              SUCCESS=true
              break
            fi
            echo "Esperando propagación... (10s)"
            sleep 10
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Error: El Frontend PWA no respondió con 200 OK tras 6 intentos."
            exit 1
          fi

          echo "Validando contenido HTML..."
          CONTENT=$(curl -s "$URL")
          if echo "$CONTENT" | grep -q "Citas Escolares"; then
            echo "✅ Frontend verificado exitosamente (PWA activa y contenido intacto)."
          else
            echo "⚠️ Advertencia: No se encontró la etiqueta 'Citas Escolares' en el HTML."
          fi

      - name: Comprobar que el Backend API responda HTTP 200 y CORS 204 (API Gateway + Lambda)
        run: |
          RAW_API_URL="${{ needs.deploy-infrastructure.outputs.api_endpoint }}"
          API_URL="${RAW_API_URL%/}" # Elimina diagonal final si existe

          # 1. Comprobación de ruta pública GET /disponibilidad
          echo "Probando GET $API_URL/disponibilidad?profesorId=101"
          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/disponibilidad?profesorId=101")
          echo "Código HTTP recibido: $API_CODE"
          if [ "$API_CODE" -ne 200 ]; then
            echo "❌ Error: Endpoint de disponibilidad no respondió 200 OK (Código: $API_CODE)"
            exit 1
          fi
          echo "✅ Endpoint /disponibilidad respondió 200 OK."

          # 2. Comprobación de Preflight CORS (OPTIONS /citas)
          echo "Probando OPTIONS $API_URL/citas"
          CORS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "$API_URL/citas")
          echo "Código HTTP recibido: $CORS_CODE"
          if [ "$CORS_CODE" -ne 204 ]; then
            echo "❌ Error: Preflight CORS OPTIONS no respondió 204 No Content (Código: $CORS_CODE)"
            exit 1
          fi
          echo "✅ Preflight CORS respondió 204 No Content."

      - name: Generar Reporte de Comprobación en GitHub Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🌐 Reporte de Despliegue y Disponibilidad del Sitio

          | Componente | Estado | URL / Identificador |
          |---|---|---|
          | **Frontend PWA (CloudFront)** | ✅ **ACTIVO (200 OK)** | ${{ needs.deploy-infrastructure.outputs.cloudfront_url }} |
          | **Backend API (API Gateway + Lambda)** | ✅ **ACTIVO (200 OK)** | ${{ needs.deploy-infrastructure.outputs.api_endpoint }} |
          | **CORS Preflight** | ✅ **VERIFICADO (204)** | `${{ needs.deploy-infrastructure.outputs.api_endpoint }}/citas` |
          | **Cognito User Pool** | ✅ **CONFIGURADO** | `${{ needs.deploy-infrastructure.outputs.cognito_user_pool_id }}` |

          > 🚀 **El sitio web móvil y sus microservicios están en línea y verificados con éxito.**
          EOF
