name: CI/CD Pipeline - Citas Escolares Serverless

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Obligatorio para autenticación OIDC con AWS (Sin llaves permanentes)
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  # ==============================================================
  # ETAPA 1: DESPLIEGUE DE INFRAESTRUCTURA (TERRAFORM)
  # ==============================================================
  deploy-infrastructure:
    name: "1. Despliegue de Infraestructura"
    runs-on: ubuntu-latest
    outputs:
      api_endpoint: ${{ steps.tf_outputs.outputs.api_endpoint }}
      s3_bucket: ${{ steps.tf_outputs.outputs.s3_bucket }}
      cloudfront_id: ${{ steps.tf_outputs.outputs.cloudfront_id }}
      cloudfront_url: ${{ steps.tf_outputs.outputs.cloudfront_url }}
      cognito_user_pool_id: ${{ steps.tf_outputs.outputs.cognito_user_pool_id }}
      cognito_app_client_id: ${{ steps.tf_outputs.outputs.cognito_app_client_id }}
      lambda_function_name: ${{ steps.tf_outputs.outputs.lambda_function_name }}

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Autenticación en AWS mediante OIDC (Zero-Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Inicializar Terraform
        working-directory: ./terraform
        run: terraform init

      - name: Validar Sintaxis de Terraform
        working-directory: ./terraform
        run: terraform validate

      - name: Aplicar Infraestructura (Terraform Apply)
        working-directory: ./terraform
        run: terraform apply -auto-approve

      - name: Exportar Variables de Salida de Infraestructura
        id: tf_outputs
        working-directory: ./terraform
        run: |
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "cloudfront_url=$(terraform output -raw cloudfront_url)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_app_client_id=$(terraform output -raw cognito_app_client_id)" >> $GITHUB_OUTPUT
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT

  # ==============================================================
  # ETAPA 2: PRUEBAS Y DESPLIEGUE DEL BACKEND (AWS LAMBDA)
  # ==============================================================
  deploy-backend:
    name: "2. Despliegue del Backend"
    runs-on: ubuntu-latest
    needs: deploy-infrastructure

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar Pruebas Unitarias del Backend
        working-directory: ./backend
        run: |
          node test/local-test.js

      - name: Autenticación en AWS mediante OIDC (Zero-Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Empaquetar Código Fuente del Microservicio
        working-directory: ./backend/src
        run: |
          zip -r ../lambda_artifact.zip .

      - name: Actualizar Código en AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ needs.deploy-infrastructure.outputs.lambda_function_name }} \
            --zip-file fileb://backend/lambda_artifact.zip

      - name: Esperar a que Lambda termine la actualización
        run: |
          aws lambda wait function-updated \
            --function-name ${{ needs.deploy-infrastructure.outputs.lambda_function_name }}

  # ==============================================================
  # ETAPA 3: CONFIGURACIÓN Y DESPLIEGUE DEL FRONTEND (S3 + CLOUDFRONT)
  # ==============================================================
  deploy-frontend:
    name: "3. Despliegue del Frontend"
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-backend]

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Inyectar Variables de Conexión en frontend/config.js
        run: |
          cat << 'EOF' > frontend/config.js
          const CONFIG = {
            API_BASE_URL: "${{ needs.deploy-infrastructure.outputs.api_endpoint }}",
            COGNITO: {
              REGION: "${{ env.AWS_REGION }}",
              USER_POOL_ID: "${{ needs.deploy-infrastructure.outputs.cognito_user_pool_id }}",
              APP_CLIENT_ID: "${{ needs.deploy-infrastructure.outputs.cognito_app_client_id }}"
            },
            DOCENTES: [
              { id: "101", nombre: "Profa. Claudia Patricia", materia: "Matemáticas", grado: "Grado 9°", avatar: "CP" },
              { id: "102", nombre: "Prof. Ramón García", materia: "Ciencias Naturales", grado: "Grado 9°", avatar: "RG" },
              { id: "103", nombre: "Profa. Laura Jiménez", materia: "Español y Literatura", grado: "Grado 9°", avatar: "LJ" }
            ],
            FRANJAS_HORARIAS: [
              "08:00 AM", "08:30 AM", "09:00 AM",
              "10:00 AM", "10:30 AM", "11:00 AM",
              "02:00 PM", "02:30 PM", "03:00 PM"
            ]
          };
          EOF
          echo "config.js actualizado con endpoint: ${{ needs.deploy-infrastructure.outputs.api_endpoint }}"

      - name: Autenticación en AWS mediante OIDC (Zero-Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Sincronizar Archivos Estáticos a Amazon S3
        run: |
          aws s3 sync ./frontend s3://${{ needs.deploy-infrastructure.outputs.s3_bucket }} \
            --delete \
            --exclude ".git*" \
            --cache-control "public, max-age=31536000, immutable"

          # index.html no se debe cachear agresivamente para reflejar cambios rápidos
          aws s3 cp ./frontend/index.html s3://${{ needs.deploy-infrastructure.outputs.s3_bucket }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidar Caché de Amazon CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-infrastructure.outputs.cloudfront_id }} \
            --paths "/*"

      - name: Resumen de Despliegue Exitoso
        run: |
          echo "=========================================================="
          echo "🚀 DESPLIEGUE COMPLETADO EXITOSAMENTE"
          echo "🌐 URL Aplicación PWA: ${{ needs.deploy-infrastructure.outputs.cloudfront_url }}"
          echo "📡 API Endpoint:       ${{ needs.deploy-infrastructure.outputs.api_endpoint }}"
          echo "=========================================================="
